[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brpmm"
version = "0.1.0"
description = "Building Resilient Process Monitoring Models — SDSC STEM4Health x J&J hackathon, group 08"
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps are provided by environment.yml on Renku; listed here so a
# plain `pip install -e .` works elsewhere too.
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # tests run without `pip install -e .`
addopts = "-q"
